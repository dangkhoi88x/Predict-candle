# Render Blueprint for the demo deployment — docs/DEPLOY_PLAN.md is the walkthrough.
#
# One web service built from the Dockerfile. The database is NOT declared here: it lives on
# Neon, because Render's free Postgres is deleted after 30 days and a demo that loses its
# accounts and history a month in is not worth the one fewer dashboard.
services:
  - type: web
    name: candles
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Singapore, and this is not a latency preference. Binance answers US addresses with HTTP
    # 451, and Render's default region is Oregon — the app would boot, pass its health check and
    # never store a single candle. Keep the Neon project in the same region.
    region: singapore
    plan: free
    branch: main
    # Waits for GitHub Actions to go green, so a red main is never what the demo is running.
    autoDeployTrigger: checksPass
    # index.html is a static file: it answers as soon as Tomcat is up, while the startup sync is
    # still running on the main thread, and it never touches the database or the exchange.
    healthCheckPath: /
    envVars:
      # --- asked for once, when the Blueprint is first applied ---
      - key: DB_URL
        sync: false # jdbc:postgresql://<endpoint>.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_WALLETS
        sync: false # comma-separated; empty closes /api/admin/** and /api/media/**

      # --- generated by Render ---
      # StartupSecretsCheck refuses to boot the prod profile on the defaults in
      # application.yaml. A generated value is 256 random bits, past HMAC-SHA256's minimum.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: ROUND_TOKEN_SECRET
        generateValue: true

      # --- fixed ---
      # The site is https-only on Render, so the refresh cookie can and must be Secure.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Render routes to $PORT; the app listens on server.port. Pin both to the same number
      # rather than relying on port detection.
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      # RateLimiter keys anonymous callers on getRemoteAddr(). Behind Render's proxy that is the
      # proxy, so every visitor would share one 40-rounds-a-minute bucket. "native" has Tomcat
      # take the client address from X-Forwarded-For, trusting only private-range proxies.
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
      # The free instance has 512 MB. Let the heap size itself from that instead of from the
      # host, and use the collector with the smallest footprint.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC
      # Let the pool empty out when nobody is playing. Hikari otherwise holds ten connections
      # open indefinitely, and a Neon compute with connections held open is not idle — it never
      # scales to zero and burns through the free plan's monthly compute hours sitting still.
      # The cost is one TLS handshake on the first query after a quiet minute.
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "60000"
      # Backfill from 2025 instead of 2022: about a third of the rows, so the first boot finishes
      # sooner and the history fits comfortably inside Neon's free storage. Delete this line for
      # the full history — the next sync only fetches forward, so it will not reach back later.
      - key: CANDLES_BACKFILL_START
        value: "2025-01-01T00:00:00Z"
