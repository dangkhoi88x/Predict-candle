name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # CandlesApplicationTests is a full @SpringBootTest, so the context fails to load without
    # a database — the suite cannot run against nothing. Port and credentials match the
    # defaults in application.yaml, which is why no secrets are needed here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: candles
          POSTGRES_USER: candles
          POSTGRES_PASSWORD: candles
        ports:
          - 5544:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B test

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Build only — no registry push wired up yet. This catches a broken Dockerfile on the
      # commit that broke it rather than at deploy time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
