server:
  compression:
    enabled: true
    # woff2 and the jpegs are already compressed; re-compressing them only burns CPU.
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

spring:
  profiles:
    # A checkout runs as `dev`, where the published secrets in this file are fine. The
    # Dockerfile sets `prod`, and StartupSecretsCheck refuses to boot there while those
    # defaults are still in use — see that class for why the two cases must differ.
    default: dev
  # Loads .env from the working directory when there is one, as a plain properties file.
  # Nothing else reads it — Spring Boot has no built-in notion of .env, docker-compose only
  # uses it for its own substitutions, and ./mvnw spring-boot:run inherits the shell, not the
  # file. "optional:" keeps startup working where the file does not exist, which is every
  # real deployment: there, these come from actual environment variables, and those still win
  # over anything imported here.
  #
  # Properties-file rules apply, so a value containing a backslash or a leading # is not read
  # the way a shell would read it.
  config:
    import: optional:file:.env[.properties]
  application:
    name: Candles
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    # The site is Vietnamese. Without this every response said "Content-Language: en-US", taken
    # from the JVM's default locale rather than from anything about the page.
    locale: vi_VN
    locale-resolver: fixed
    resources:
      cache:
        cachecontrol:
          # no-cache, not no-store. "no-store" forbids keeping a copy at all, so every visit
          # re-downloaded the whole front end — 4.4 MB, most of it the wallet bundle.
          # "no-cache" still guarantees freshness: the browser keeps its copy but must
          # revalidate before using it, so an edited file arrives immediately and an
          # unchanged one costs a 304 with an empty body instead of the file.
          no-cache: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5544/candles}
    username: ${DB_USERNAME:candles}
    password: ${DB_PASSWORD:candles}
  flyway:
    # Databases created before Flyway existed here already hold the V1 schema, so they get
    # stamped at V1 rather than having it re-run at them. A brand new database is empty and
    # runs every migration from V1.
    baseline-on-migrate: true
    # No migration here uses placeholders, and leaving substitution on makes seeded JSON a
    # trap: a dollar-quoted object starts $c${"id":…, where the quote tag's closing $ and the
    # object's { read as ${ and Flyway demands a value for a placeholder nobody wrote.
    placeholder-replacement: false
  jpa:
    hibernate:
      # Flyway owns the schema now. "validate" does not touch it — it only refuses to start
      # when the entities and the tables have drifted apart, which is the whole reason for
      # dropping "update": that setting silently patched the difference and told nobody.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

candles:
  admin:
    # Wallet addresses holding the ADMIN role, comma-separated. Reconciled into the users
    # table at every startup: listed wallets are promoted, unlisted admins are demoted — so
    # this file, not a database row, decides who can administer the app. Empty closes
    # /api/admin/** and /api/media/** entirely.
    wallets: ${ADMIN_WALLETS:}
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
  media:
    max-image-size-bytes: ${MEDIA_MAX_IMAGE_SIZE_BYTES:10485760}
    # Wallet addresses allowed to upload/delete media, comma-separated. Empty by default:
    # these endpoints write to the shared Cloudinary account, so an unconfigured allowlist
    # closes them rather than leaving them open to anyone who connected a wallet.
    admin-wallets: ${MEDIA_ADMIN_WALLETS:}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  timeframe: 1h
  telegram:
    # The bot the Mini App runs under (BotFather). The token signs every launch's initData, so it is
    # the whole secret of Telegram login — environment only. Empty turns Telegram login off.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # For share links that open inside Telegram: https://t.me/<bot-username>/<app-name>.
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    app-name: ${TELEGRAM_APP_NAME:}
    init-data-max-age: PT24H
    # Group chats that agreed to the daily reminders, comma-separated ids (a group's is negative).
    # Empty sends nothing. See TelegramDailyBroadcastService and DEPLOY_PLAN §4.5.
    daily-chat-ids: ${TELEGRAM_DAILY_CHAT_IDS:}
    # Vietnam time (the scheduler's zone). "-" switches that message off.
    morning-cron: ${TELEGRAM_MORNING_CRON:0 0 8 * * *}
    evening-cron: ${TELEGRAM_EVENING_CRON:0 0 21 * * *}
    api-base-url: https://api.telegram.org
  analytics:
    # GoatCounter site code (the part before .goatcounter.com). Empty counts nothing, which is
    # every checkout — only the deployment sets it. See SiteConfigController and analytics.js.
    goatcounter: ${ANALYTICS_GOATCOUNTER:}
  # Where candles and live prices come from: binance or okx. Binance locally; the Render demo
  # sets okx, because Binance bans by address and kept banning Render's shared Singapore range
  # for traffic this app did not send. Switching on a database that already holds candles mixes
  # two exchanges' prices in one history — fine for a demo, worth knowing anywhere else.
  price-source: binance
  binance:
    base-url: https://api.binance.com
  okx:
    base-url: https://www.okx.com
  backfill:
    start: 2022-01-01T00:00:00Z
  assets:
    - symbol: BTCUSDT
      name: Bitcoin
    - symbol: ETHUSDT
      name: Ethereum
    - symbol: BNBUSDT
      name: BNB
    - symbol: SOLUSDT
      name: Solana
  round:
    min-range-pct: 0.15
    # Bottom ~3% of candles by body size; below this the direction is decided by the fifth
    # decimal place and the guess is a coin flip.
    min-answer-body-pct: 0.01
    max-attempts: 20
    repeat-cache-ttl: PT5M
    visible-candles: 20
    guesses-per-chart: 5
    reveal-candles-after-complete: 5
    # Candles either side of the round, shown only on the post-session context chart. These
    # are the ones the player never got to see: what led into the setup, and how it resolved
    # past the reveal.
    context-padding: 12
    # What practice can be played at. The first is the stored timeframe; the rest are folded from
    # it by CandleAggregator, so nothing new is synced. Nothing shorter than the stored one can
    # ever be added here — those minutes were never recorded.
    timeframes: [1h, 4h, 1d]
    timing:
      seconds: 20
      # Between the answer candle's reveal animation and a round trip, the honest gap between
      # "the clock hit zero on screen" and "the request landed" is a second or two.
      grace: PT5S
      min-think-time: PT0.25S
    rate-limit:
      # Room for a fast player — a round is one fetch plus five guesses — and no room for a
      # script walking the history.
      rounds-per-minute: 40
      guesses-per-minute: 120
  demo:
    # Play money handed to a new account, and again on every reset. Round enough to read at a
    # glance and big enough that one bad trade is not the end of the run.
    starting-balance: 10000
    # Charged on both sides of a round trip. Without it there is no cost to churning, and a
    # portfolio ends up measuring how often someone traded rather than how well.
    fee-bps: 10
  live:
    # Picks close this long before the candle does. Rekto uses 30 minutes of a four-hour
    # candle; this is the same eighth of an hourly one. Shrinking it towards zero turns the
    # game into "watch the price and call the obvious", which is the failure worth guarding.
    lock-before: PT8M
    # Past rounds shown in the strip. They cost nothing to produce — every stored candle is
    # already a settled round — so this is a display choice, not a budget.
    history-size: 24
    # Every open browser tab asks for the live price on a timer, and they all want the same
    # number. This has to be *at least* as long as the frontend's poll interval (live.js's
    # POLL_MS, 3s) — a shorter TTL means a lone tab's own next poll always finds its own cache
    # entry already expired, which is a 100% miss rate for exactly the case this cache exists
    # to help, and only amortises anything once enough concurrent tabs happen to overlap within
    # the window.
    price-cache-ttl: PT4S
    # Candles shown either side of a round in its detail popup — enough to see the run-up and
    # the aftermath without asking for the asset's whole history every time someone clicks a
    # settled round.
    context-candles: 20
  jwt:
    secret: ${ROUND_TOKEN_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: PT10M
