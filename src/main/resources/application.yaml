server:
  compression:
    enabled: true
    # woff2 and the jpegs are already compressed; re-compressing them only burns CPU.
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

spring:
  application:
    name: Candles
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      cache:
        cachecontrol:
          # no-cache, not no-store. "no-store" forbids keeping a copy at all, so every visit
          # re-downloaded the whole front end — 4.4 MB, most of it the wallet bundle.
          # "no-cache" still guarantees freshness: the browser keeps its copy but must
          # revalidate before using it, so an edited file arrives immediately and an
          # unchanged one costs a 304 with an empty body instead of the file.
          no-cache: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5544/candles}
    username: ${DB_USERNAME:candles}
    password: ${DB_PASSWORD:candles}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

candles:
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
  media:
    max-image-size-bytes: ${MEDIA_MAX_IMAGE_SIZE_BYTES:10485760}
    # Wallet addresses allowed to upload/delete media, comma-separated. Empty by default:
    # these endpoints write to the shared Cloudinary account, so an unconfigured allowlist
    # closes them rather than leaving them open to anyone who connected a wallet.
    admin-wallets: ${MEDIA_ADMIN_WALLETS:}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  timeframe: 1h
  binance:
    base-url: https://api.binance.com
  backfill:
    start: 2022-01-01T00:00:00Z
  assets:
    - symbol: BTCUSDT
      name: Bitcoin
    - symbol: ETHUSDT
      name: Ethereum
    - symbol: BNBUSDT
      name: BNB
    - symbol: SOLUSDT
      name: Solana
  round:
    min-range-pct: 0.15
    max-attempts: 20
    repeat-cache-ttl: PT5M
    visible-candles: 20
    guesses-per-chart: 5
    reveal-candles-after-complete: 5
  jwt:
    secret: ${ROUND_TOKEN_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: PT10M
